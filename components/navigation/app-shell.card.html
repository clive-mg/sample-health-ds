<!-- @dsCard group="Components" viewport="1280x820" name="App shell" subtitle="Top bar + sidebar, desktop to mobile" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;background:var(--colors-background-bg-secondary);font-family:var(--font-body)}#root{display:flex;flex-direction:column;height:100vh}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/icons/icon-data.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const UI = window.UntitledUIPRODesignSystem_380e88;
const { SidebarNav, TopNav, Icon } = UI;

const PLAIN = [
  { label: "Dashboard", icon: "Home01" }, { label: "Members", icon: "Users01" },
  { label: "Providers", icon: "UserPlus01" }, { label: "Claims", icon: "File02", badge: 12 },
  { label: "Prior Authorizations", icon: "ShieldTick" }, { label: "Drug Records", icon: "PieChart01" }
];
const GROUPED = [
  { items: [{ label: "Dashboard", icon: "Home01" }] },
  { label: "Casework", items: [
    { label: "Members", icon: "Users01" }, { label: "Providers", icon: "UserPlus01" },
    { label: "Claims", icon: "File02", badge: 12 }, { label: "Prior Authorizations", icon: "ShieldTick" }
  ] },
  { label: "Drug & Clinical", items: [
    { label: "Drug Records", icon: "PieChart01" }, { label: "RxDUR", icon: "Copy01" }
  ] },
  { label: "Back Office", items: [
    { label: "Operations", icon: "Headphones01" }, { label: "Finance", icon: "CurrencyDollar" }
  ] }
];
const TREE = [
  { items: [{ label: "Dashboard", icon: "Home01" }] },
  { label: "Casework", items: [
    { label: "Members", icon: "Users01" }, { label: "Providers", icon: "UserPlus01" },
    { label: "Claims", icon: "File02", badge: 12, children: [{ label: "Open", badge: 4 }, { label: "Processed" }, { label: "Appeals" }] },
    { label: "Prior Authorizations", icon: "ShieldTick" }
  ] },
  { label: "Drug & Clinical", items: [
    { label: "Drug Records", icon: "PieChart01" },
    { label: "RxDUR", icon: "Copy01", children: [{ label: "Alerts", badge: 4 }, { label: "Rules" }, { label: "Reports" }] }
  ] },
  { label: "Setup & Administration", items: [
    { label: "Benefits & PA Setup", icon: "FileCheck02" }, { label: "System Administration", icon: "List" }
  ] }
];
const LISTS = { Plain: PLAIN, Grouped: GROUPED, Collapsible: TREE };
const FRAME = { Desktop: null, Tablet: 1024, Mobile: 390 };
const CTRL = { fontFamily: "var(--font-body)", fontSize: 12, lineHeight: "18px", fontWeight: 500 };

function Seg({ label, value, options, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ ...CTRL, color: "var(--colors-text-text-tertiary-600)" }}>{label}</span>
      <div style={{ display: "flex", gap: 2, padding: 2, borderRadius: "var(--radius-md-px)", background: "var(--colors-background-bg-secondary)", boxShadow: "inset 0 0 0 1px var(--colors-border-border-secondary)" }}>
        {options.map((o) => (
          <button key={o} type="button" onClick={() => onChange(o)} style={{
            padding: "4px 8px", border: "none", borderRadius: "var(--radius-sm-px)", cursor: "pointer", ...CTRL,
            fontWeight: value === o ? 700 : 500,
            background: value === o ? "var(--colors-background-bg-primary)" : "transparent",
            color: value === o ? "var(--colors-text-text-secondary-700)" : "var(--colors-text-text-tertiary-600)",
            boxShadow: value === o ? "0 1px 2px 0 var(--colors-effects-shadows-shadow-sm-01)" : "none"
          }}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function Toggle({ theme, open, mobile, onClick }) {
  return (
    <button type="button" aria-label={open ? (mobile ? "Close menu" : "Collapse navigation") : (mobile ? "Open menu" : "Expand navigation")}
      aria-expanded={open} onClick={onClick} style={{
      display: "inline-flex", alignItems: "center", justifyContent: "center", width: 40, height: 40,
      border: "none", borderRadius: "var(--radius-md-px)", background: "transparent", cursor: "pointer",
      color: theme === "brand" ? "var(--colors-brand-100)" : "var(--colors-foreground-fg-quaternary-500)"
    }}>
      {mobile ? <Icon name={open ? "XClose" : "Menu01"} size={24} aria-hidden="true" /> : (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5" stroke="currentColor" strokeWidth="1.8"></rect>
          <path d="M9.5 4.5v15" stroke="currentColor" strokeWidth="1.8"></path>
          <path d={open ? "M17 8.4v7.2L13 12z" : "M14 8.4v7.2L18 12z"} fill="currentColor"></path>
        </svg>
      )}
    </button>
  );
}

function Demo() {
  const [theme, setTheme] = React.useState("Light");
  const [list, setList] = React.useState("Grouped");
  const [view, setView] = React.useState("Desktop");
  const [current, setCurrent] = React.useState("Claims");
  const [pref, setPref] = React.useState(null);

  const vp = view.toLowerCase();
  /* `pref` is the user's override; null means "whatever the breakpoint would do". */
  const open = pref == null ? vp === "desktop" : pref;
  React.useEffect(() => { setPref(null); }, [view]);
  const data = LISTS[list];
  const w = FRAME[view];

  return (<>
    <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 24, padding: "12px 16px", flexShrink: 0, background: "var(--colors-background-bg-primary)", boxShadow: "inset 0 -1px 0 0 var(--colors-border-border-secondary)" }}>
      <Seg label="Viewport" value={view} options={["Desktop", "Tablet", "Mobile"]} onChange={setView} />
      <Seg label="List" value={list} options={["Plain", "Grouped", "Collapsible"]} onChange={setList} />
      <Seg label="Theme" value={theme} options={["Light", "Brand"]} onChange={setTheme} />
    </div>
    <div style={{ display: "flex", justifyContent: "center", flex: 1, minHeight: 0, padding: w ? 24 : 0, background: "var(--colors-background-bg-secondary)", boxSizing: "border-box" }}>
      <div style={{
        display: "flex", flexDirection: "column", width: w || "100%", flexShrink: 0, minHeight: 0,
        borderRadius: w ? 12 : 0, overflow: "hidden", background: "var(--colors-background-bg-secondary)",
        boxShadow: w ? "0 0 0 1px var(--colors-border-border-primary)" : "none"
      }}>
        <TopNav theme={theme.toLowerCase()} items={[]} search actions inset={16} logoHeight={28}
          compact={vp === "mobile"}
          logoSrc={theme === "Brand" ? "../../assets/logo-nav-white.png" : "../../assets/logo-nav.png"}
          account={{ name: "Olivia Rhye", email: "olivia@samplehealth.com", initials: "OR" }}
          leading={<Toggle theme={theme.toLowerCase()} open={open} mobile={vp === "mobile"} onClick={() => setPref(!open)} />}
          style={{ flexShrink: 0 }} />
        {/* The shell is the positioned ancestor the tablet overlay and the mobile drawer resolve against. */}
        <div style={{ position: "relative", display: "flex", flex: 1, minHeight: 0, overflow: "hidden" }}>
          <SidebarNav theme={theme.toLowerCase()} viewport={vp} open={open} onClose={() => setPref(false)}
            {...(list === "Plain" ? { items: data } : { groups: data })}
            current={current} onSelect={setCurrent} expanded={["RxDUR"]} />
          <main style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "var(--colors-background-bg-secondary)" }}>
            <div style={{ fontFamily: "var(--font-body)", fontSize: 30, lineHeight: "36px", fontWeight: 600, letterSpacing: "var(--tracking-tight)", color: "var(--colors-text-text-tertiary-600)" }}>{current}</div>
          </main>
        </div>
      </div>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
