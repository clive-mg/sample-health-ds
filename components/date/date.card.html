<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;padding:24px;background:var(--colors-background-bg-secondary);font-family:var(--font-body)}.wrap{display:flex;gap:24px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:24px;width:360px}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/icons/icon-data.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const UI = window.UntitledUIPRODesignSystem_380e88;
const { Calendar, DatePicker, DateRangePicker, DateRangeFields } = UI;
const t = new Date();
const d = (n) => new Date(t.getFullYear(), t.getMonth(), n);
function Demo(){
  return (
    <div className="wrap">
      <Calendar defaultValue={d(14)} />
      <div className="col">
        <DatePicker label="Appointment date" defaultValue={d(14)} />
        <DateRangePicker label="Claim period" defaultValue={{ start: d(6), end: d(20) }} />
        <DateRangeFields defaultValue={{ start: d(6), end: d(20) }} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
