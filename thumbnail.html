<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; }
  .tile { width: 1280px; height: 854px; display: flex; font-family: var(--font-display, "Inter", sans-serif); }
  .main { flex: 3; background: var(--colors-blue-600, #1570EF); display: flex; align-items: center; justify-content: center; padding: 72px; }
  .main h1 { margin: 0; color: #fff; font-size: 156px; line-height: 0.92; font-weight: 700; letter-spacing: -0.03em; text-align: center; }
  .strip { flex: 1; display: flex; flex-direction: column; }
  .strip span { flex: 1; display: block; }
</style>
</head>
<body>
<div class="tile">
  <div class="main"><h1>Sample<br />Health</h1></div>
  <div class="strip">
    <span style="background:#84CAFF"></span>
    <span style="background:#2E90FA"></span>
    <span style="background:#6172F3"></span>
    <span style="background:#1849A9"></span>
  </div>
</div>
</body>
</html>
